version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: toxicbuddy-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./toxicbuddy.db
    volumes:
      - ./toxicbuddy.db:/app/toxicbuddy.db
      - ./ml/models:/app/ml/models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: toxicbuddy-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
